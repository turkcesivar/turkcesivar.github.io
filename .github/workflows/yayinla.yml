name: Siteyi üret ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siteyi üret
        run: |
          pip install --quiet pillow
          python uret.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Yayınla
        id: dagit
        uses: actions/deploy-pages@v4
